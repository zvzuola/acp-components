name: Feature request
description: Propose an improvement or new integration
title: '[feature] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer or user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API, component, transport, platform capability, or example you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Likely scope
      options:
        - Core
        - React
        - Platform or transport
        - Example or starter
        - Documentation
        - Unsure
    validations:
      required: true
